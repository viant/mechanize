---
pipeline:
  session:
    action: mcp/runner:call
    url: "$endpoint"
    bearerTokenSecret: "$credentialResource"
    name: mechanize_session_open
    arguments:
      name: Calculator DSL example
    post:
      sessionId: "$StructuredContent.sessionId"
  read:
    action: mcp/runner:call
    url: "$endpoint"
    bearerTokenSecret: "$credentialResource"
    name: mechanize_script_run
    arguments:
      sessionId: "$sessionId"
      purpose: Read Calculator result through the native accessibility API
      clientRequestId: "$requestId"
      format: dsl
      source: |
        let calc = app("com.apple.calculator").window(title: "Calculator")
        let result = calc.getByRole("text", exact: true).within(calc.getById("StandardResultView", exact: true)).read("staticText")
        let entry = calc.getByRole("text", exact: true).within(calc.getById("StandardInputView", exact: true)).read("staticText")
    post:
      operationId: "$StructuredContent.operationId"
      runId: "$StructuredContent.runId"
  wait:
    action: mcp/runner:call
    url: "$endpoint"
    bearerTokenSecret: "$credentialResource"
    name: mechanize_operation_status
    arguments:
      sessionId: "$sessionId"
      operationId: "$operationId"
    repeat: 120
    sleepTimeMs: 250
    exit: "$calculatorOperationStatus:succeeded || $calculatorOperationStatus:failed
      || $calculatorOperationStatus:cancelled"
    post:
      calculatorOperationStatus: "$StructuredContent.executionStatus"
      operation: "$StructuredContent"
  reportOperation:
    action: print
    message: "$AsJSON($operation)"
  assertRead:
    action: validator:assert
    name: Native Calculator DSL read completed
    actual: "$operation"
    expect:
      executionStatus: succeeded
  outputs:
    action: mcp/runner:call
    url: "$endpoint"
    bearerTokenSecret: "$credentialResource"
    name: mechanize_operation_outputs
    arguments:
      sessionId: "$sessionId"
      operationId: "$operationId"
      bindings:
      - result
      - entry
    post:
      readOutputs: "$StructuredContent"
  result:
    action: print
    message: "$AsJSON($readOutputs)"
