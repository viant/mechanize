---
pipeline:
  session:
    action: mcp/runner:call
    url: "$endpoint"
    bearerTokenSecret: "$credentialResource"
    name: mechanize_session_open
    arguments:
      name: Calculator DSL example
    post:
      sessionId: "$StructuredContent.sessionId"
  read:
    action: mcp/runner:call
    url: "$endpoint"
    bearerTokenSecret: "$credentialResource"
    name: mechanize_script_run
    arguments:
      sessionId: "$sessionId"
      grantId: "$grantId"
      purpose: Read Calculator result through the native accessibility API
      clientRequestId: "$requestId"
      format: yaml
      source: |
        ---
        schemaVersion: 1
        name: Verify Calculator result using generic DSL
        goal:
          description: Verify the Calculator result from the 17 times 23 demonstration.
          successCriteria:
          - The native Calculator result display reads 391.
        surfaces:
          calculator:
            kind: native
            bundleId: com.apple.calculator
        requires:
          adapters:
          - native
        steps:
        - id: verify-result
          purpose: Read the result and independently verify its displayed value.
          command: 'let result = calculator.window(title: "Calculator").getByRole("text",
            exact: true).within(calculator.window(title: "Calculator").getById("StandardInputView",
            exact: true)).read("staticText")'
          postcondition:
            kind: adapter
            adapter: native
            name: valueEquals
            inputs:
              bundleID:
                kind: string
                string: com.apple.calculator
              strategy:
                kind: string
                string: role
              selector:
                kind: string
                string: text
              windowTitle:
                kind: string
                string: Calculator
              ancestorID:
                kind: string
                string: StandardInputView
              attribute:
                kind: string
                string: staticText
              expected:
                kind: string
                string: '391'
            scope:
              surfaceRef: calculator
            timeoutMs: 10000
            freshnessMs: 1000
            requiredAuthority: observational
    post:
      operationId: "$StructuredContent.operationId"
      runId: "$StructuredContent.runId"
  wait:
    action: mcp/runner:call
    url: "$endpoint"
    bearerTokenSecret: "$credentialResource"
    name: mechanize_operation_status
    arguments:
      sessionId: "$sessionId"
      operationId: "$operationId"
    repeat: 120
    sleepTimeMs: 250
    exit: "$calculatorOperationStatus:succeeded || $calculatorOperationStatus:failed
      || $calculatorOperationStatus:cancelled"
    post:
      calculatorOperationStatus: "$StructuredContent.executionStatus"
      operation: "$StructuredContent"
  reportOperation:
    action: print
    message: "$AsJSON($operation)"
  assertRead:
    action: validator:assert
    name: Native Calculator DSL read completed
    actual: "$operation"
    expect:
      executionStatus: succeeded
