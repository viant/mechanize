# Existing Writer single-paragraph edit stage only; does not open, copy, save, or format.
# Requires an owned session and freshly verified active editing copy/process/focus.
# Never use this stage against a multi-paragraph element or an unverified original.
# Preview prints the supplied text: use public fixture text for preview.
init:
- name: endpoint
  from: endpoint
  required: true
- name: credentialResource
  from: credentialResource
  required: true
- name: officePid
  from: officePid
  required: true
- name: officeBirth
  from: officeBirth
  required: true
- name: requestId
  from: requestId
  required: true
- name: sessionId
  from: sessionId
  required: true
- name: oldText
  from: oldText
  required: true
- name: newText
  from: newText
  required: true
- name: writerPlan
  value:
    schemaVersion: 1
    name: Edit one verified existing Writer paragraph
    goal:
      description: Replace exactly one previously inspected focused Writer paragraph
        after an exact old-text comparison, preserving the source through an already-created
        separate editing copy.
      successCriteria:
      - The focused paragraph exactly matches the requested new text.
    inputs:
      oldText:
        type: string
        required: true
      newText:
        type: string
        required: true
    bindings:
    - name: replacement
      type: value
      value:
        kind: reference
        ref: input.newText
        expected: string
    surfaces:
      office:
        kind: native
        bundleId: org.openoffice.script
        processId: $AsInt($officePid)
        processStartToken: $officeBirth
    requires:
      adapters:
      - native
    steps:
    - id: guard-writer-kind
      purpose: Confirm the observed Writer Table menu is enabled before editing.
      timeoutMs: 10000
      command: 'expect(office.menuBar().getByRole("menuitem", name: "Table", exact:
        true)).toBeEnabled()'
    - id: replace-verified-existing-paragraph
      purpose: Replace only the exact previously inspected old paragraph, then compare
        its new text independently.
      timeoutMs: 10000
      command: 'office.focusedElement().getByRole("textbox", exact: true).replaceText(replacement)'
      effect:
        businessKey:
          task:
            kind: string
            string: writer-existing-paragraph-edit
          requestId:
            kind: string
            string: $requestId
          processId:
            kind: number
            number: $AsInt($officePid)
          processStartToken:
            kind: string
            string: $officeBirth
        reconcile:
          kind: adapter
          adapter: native
          name: literalValueMatches
          scope:
            surfaceRef: office
          timeoutMs: 10000
          freshnessMs: 1000
          requiredAuthority: observational
          inputs:
            bundleID:
              kind: string
              string: org.openoffice.script
            processId:
              kind: number
              number: $AsInt($officePid)
            processStartToken:
              kind: string
              string: $officeBirth
            strategy:
              kind: string
              string: role
            selector:
              kind: string
              string: textbox
            nativeRoot:
              kind: string
              string: focusedElement
            attribute:
              kind: string
              string: value
            expected:
              kind: reference
              ref: input.newText
              expected: string
      precondition:
        kind: adapter
        adapter: native
        name: literalValueMatches
        scope:
          surfaceRef: office
        timeoutMs: 10000
        freshnessMs: 1000
        requiredAuthority: observational
        inputs:
          bundleID:
            kind: string
            string: org.openoffice.script
          processId:
            kind: number
            number: $AsInt($officePid)
          processStartToken:
            kind: string
            string: $officeBirth
          strategy:
            kind: string
            string: role
          selector:
            kind: string
            string: textbox
          nativeRoot:
            kind: string
            string: focusedElement
          attribute:
            kind: string
            string: value
          expected:
            kind: reference
            ref: input.oldText
            expected: string
      postcondition:
        kind: adapter
        adapter: native
        name: literalValueMatches
        scope:
          surfaceRef: office
        timeoutMs: 10000
        freshnessMs: 1000
        requiredAuthority: observational
        inputs:
          bundleID:
            kind: string
            string: org.openoffice.script
          processId:
            kind: number
            number: $AsInt($officePid)
          processStartToken:
            kind: string
            string: $officeBirth
          strategy:
            kind: string
            string: role
          selector:
            kind: string
            string: textbox
          nativeRoot:
            kind: string
            string: focusedElement
          attribute:
            kind: string
            string: value
          expected:
            kind: reference
            ref: input.newText
            expected: string
- name: writerRequest
  value:
    format: yaml
    source: $AsJSON($writerPlan)
    inputs:
      oldText: $oldText
      newText: $newText
pipeline:
  preview:
    action: print
    message: $AsJSON($writerRequest)
  stage:
    action: mcp/runner:call
    url: $endpoint
    bearerTokenSecret: $credentialResource
    name: mechanize_script_run
    arguments:
      sessionId: $sessionId
      purpose: Edit one verified existing paragraph in the already active separate
        Writer copy
      clientRequestId: $requestId
      format: $writerRequest.format
      inputs: $writerRequest.inputs
      source: $writerRequest.source
    post:
      operationId: $StructuredContent.operationId
      runId: $StructuredContent.runId
  wait:
    action: mcp/runner:call
    url: $endpoint
    bearerTokenSecret: $credentialResource
    name: mechanize_operation_status
    arguments:
      sessionId: $sessionId
      operationId: $operationId
    repeat: 120
    sleepTimeMs: 250
    exit: $operationStatus:succeeded || $operationStatus:failed || $operationStatus:cancelled
      || $operationStatus:unknown
    post:
      operationStatus: $StructuredContent.executionStatus
      operation: $StructuredContent
  report:
    action: print
    message: $AsJSON($operation)
