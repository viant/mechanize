# Prerequisite: saved Calc workbook with only A1=Date verified, selection A2.
# Run verify-artifacts.py separately after save; UI success alone does not prove content.
init:
- {name: calcOperationId, value: ''}
- {name: saveOperationId, value: ''}
- {name: calcOperationStatus, value: ''}
- {name: saveOperationStatus, value: ''}
- {name: endpoint, from: endpoint, required: true}
- {name: credentialResource, from: credentialResource, required: true}
- {name: officePid, from: officePid, required: true}
- {name: officeBirth, from: officeBirth, required: true}
- {name: windowId, from: windowId, required: true}
- {name: requestId, from: requestId, required: true}
- {name: sessionId, from: sessionId, value: ''}
- {name: calcRequestId, value: '${requestId}-calc-data'}
- {name: saveRequestId, value: '${requestId}-calc-save'}
- name: calcPlan
  value:
    schemaVersion: 1
    name: Compose the mortgage comparison into a prequalified Calc workbook
    goal:
      description: 'Enter the verified mortgage comparison data into the already-saved blank Calc workbook. Prerequisite:
        A1 contains the independently verified string Date and the current selection is A2.'
      successCriteria: [The 106-step data-entry plan verifies each expected edit control and committed cell transition.,
        'After a separate save run, the saved ODS passes the read-only artifact verifier.']
    surfaces: &id075
      office: {kind: native, bundleId: org.openoffice.script, processId: $AsInt($officePid), processStartToken: $officeBirth}
    steps:
    - id: activate-calc
      purpose: Refresh foreground without changing cell contents
      command: office.activate()
      effect:
        businessKey:
          task: {kind: string, string: mortgage-calc-batch-activate-headers-commit-v2}
          requestId: &id001 {kind: string, string: $calcRequestId}
    - id: return-a1
      purpose: Move from E1 to A1
      command: 'office.pressWindowKey(windowId: $AsInt($windowId), key: "Cmd+Home")'
      effect:
        businessKey:
          task: {kind: string, string: calc-return-a1-repair-commit-v2}
          requestId: *id001
      precondition: &id024
        kind: adapter
        adapter: native
        name: valueEquals
        scope: &id002 {surfaceRef: office}
        timeoutMs: 10000
        freshnessMs: 2000
        requiredAuthority: observational
        inputs:
          bundleID: &id003 {kind: string, string: org.openoffice.script}
          processStartToken: &id004 {kind: string, string: $officeBirth}
          strategy: &id005 {kind: string, string: role}
          selector: &id006 {kind: string, string: textbox}
          nativeRoot: &id007 {kind: string, string: focusedElement}
          attribute: &id008 {kind: string, string: name}
          processId: &id009 {kind: number, number: $AsInt($officePid)}
          expected: {kind: string, string: A2}
      postcondition: &id010
        kind: adapter
        adapter: native
        name: valueEquals
        scope: *id002
        timeoutMs: 10000
        freshnessMs: 2000
        requiredAuthority: observational
        inputs:
          bundleID: *id003
          processStartToken: *id004
          strategy: *id005
          selector: *id006
          nativeRoot: *id007
          attribute: *id008
          processId: *id009
          expected: {kind: string, string: A1}
    - id: next-b1
      purpose: Move from E1 to A1
      command: 'office.pressWindowKey(windowId: $AsInt($windowId), key: "ArrowRight")'
      effect:
        businessKey:
          task: {kind: string, string: calc-next-b1-repair-commit-v2}
          requestId: *id001
      precondition: *id010
      postcondition: &id011
        kind: adapter
        adapter: native
        name: valueEquals
        scope: *id002
        timeoutMs: 10000
        freshnessMs: 2000
        requiredAuthority: observational
        inputs:
          bundleID: *id003
          processStartToken: *id004
          strategy: *id005
          selector: *id006
          nativeRoot: *id007
          attribute: *id008
          processId: *id009
          expected: {kind: string, string: B1}
    - id: edit-B1
      purpose: Enter the confirmed B1 editor
      command: 'office.pressWindowKey(windowId: $AsInt($windowId), key: "F2")'
      effect:
        businessKey:
          task: {kind: string, string: mortgage-calc-B1-edit-commit-v2}
          requestId: *id001
      precondition: *id011
      postcondition: &id016
        kind: adapter
        adapter: native
        name: valueEquals
        scope: *id002
        timeoutMs: 10000
        freshnessMs: 2000
        requiredAuthority: observational
