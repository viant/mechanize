- {name: calcSource, value: $AsJSON($calcPlan)}
- name: savePlan
  value:
    schemaVersion: 1
    name: Save the populated mortgage comparison workbook
    goal:
      description: Send Cmd+S once after the table plan leaves Calc selected at B8; the downstream artifact verifier
        checks saved bytes.
      successCriteria: [Calc returns to the expected B8 selection after the save command.]
    surfaces: *id075
    requires: *id076
    steps:
    - id: activate-calc-for-save
      purpose: Activate the exact Calc process before saving its populated workbook.
      timeoutMs: 10000
      command: office.activate()
      effect:
        businessKey:
          task: {kind: string, string: mortgage-calc-save-activate}
          requestId: &id077 {kind: string, string: $saveRequestId}
    - id: save-calc
      purpose: Send Cmd+S once from the already-saved workbook and verify Calc returns to B8; saved bytes are checked
        by the separate artifact verifier.
      timeoutMs: 10000
      command: 'office.pressWindowKey(windowId: $AsInt($windowId), key: "Cmd+S")'
      effect:
        businessKey:
          task: {kind: string, string: mortgage-calc-save-ods}
          requestId: *id077
      precondition: *id078
      postcondition: *id078
- {name: saveSource, value: $AsJSON($savePlan)}
- name: previewRequest
  value: {calcSource: $calcSource, saveSource: $saveSource}
pipeline:
  preview: {action: print, message: $AsJSON($previewRequest)}
  validateCalc:
    action: mcp/runner:call
    url: $endpoint
    bearerTokenSecret: $credentialResource
    name: mechanize_script_validate
    arguments: {format: json, source: $calcSource}
    post: {calcPlanValid: $StructuredContent.valid, calcValidation: $StructuredContent}
  validateSave:
    action: mcp/runner:call
    url: $endpoint
    bearerTokenSecret: $credentialResource
    name: mechanize_script_validate
    arguments: {format: json, source: $saveSource}
    post: {savePlanValid: $StructuredContent.valid, saveValidation: $StructuredContent}
  session:
    when: $calcPlanValid:true && $savePlanValid:true && $Len($sessionId) == 0
    action: mcp/runner:call
    url: $endpoint
    bearerTokenSecret: $credentialResource
    name: mechanize_session_open
    arguments: {name: Compose the mortgage comparison in Calc}
    post: {sessionId: $StructuredContent.sessionId}
  runCalc:
    when: $calcPlanValid:true && $savePlanValid:true
    action: mcp/runner:call
    url: $endpoint
    bearerTokenSecret: $credentialResource
    name: mechanize_script_run
    arguments: {sessionId: $sessionId, purpose: Populate the mortgage comparison in the prequalified saved Calc
        workbook, clientRequestId: $calcRequestId, format: json, source: $calcSource}
    post: {calcOperationId: $StructuredContent.operationId, calcRunId: $StructuredContent.runId}
  waitCalc:
    when: $Len($calcOperationId) > 0
    action: mcp/runner:call
    url: $endpoint
    bearerTokenSecret: $credentialResource
    name: mechanize_operation_status
    arguments: {sessionId: $sessionId, operationId: $calcOperationId}
    repeat: 2400
    sleepTimeMs: 250
    exit: $calcOperationStatus:succeeded || $calcOperationStatus:failed || $calcOperationStatus:cancelled || $calcOperationStatus:unknown
    post: {calcOperationStatus: $StructuredContent.executionStatus, calcOperation: $StructuredContent}
  runSave:
    when: $calcOperationStatus:succeeded
    action: mcp/runner:call
    url: $endpoint
    bearerTokenSecret: $credentialResource
    name: mechanize_script_run
    arguments: {sessionId: $sessionId, purpose: Save the populated mortgage comparison and verify its saved ODS
        artifact, clientRequestId: $saveRequestId, format: json, source: $saveSource}
    post: {saveOperationId: $StructuredContent.operationId, saveRunId: $StructuredContent.runId}
  waitSave:
    when: $Len($saveOperationId) > 0
    action: mcp/runner:call
    url: $endpoint
    bearerTokenSecret: $credentialResource
    name: mechanize_operation_status
    arguments: {sessionId: $sessionId, operationId: $saveOperationId}
    repeat: 1200
    sleepTimeMs: 250
    exit: $saveOperationStatus:succeeded || $saveOperationStatus:failed || $saveOperationStatus:cancelled || $saveOperationStatus:unknown
    post: {saveOperationStatus: $StructuredContent.executionStatus, saveOperation: $StructuredContent}
  reportCalc: {when: $Len($calcOperationId) > 0, action: print, message: $AsJSON($calcOperation)}
  reportSave: {when: $Len($saveOperationId) > 0, action: print, message: $AsJSON($saveOperation)}
