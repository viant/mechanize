          processStartToken: *id004
          strategy: *id005
          selector: *id006
          nativeRoot: *id007
          attribute: {kind: string, string: focused}
          processId: *id009
          expected: {kind: boolean, boolean: true}
    - id: write-B1
      purpose: Enter and verify the literal or formula in B1
      command: 'office.focusedElement().getByRole("textbox", name: "Paragraph 0", exact: true).replaceText("30yr
        fixed")'
